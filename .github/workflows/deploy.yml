# Build the site and publish it to GitHub Pages.
#
# Deliberately `npm run build` and not `npm run build:workbench` — the latter is
# the *artifact* build, which inlines the export worker into the main bundle and
# more than doubles what a visitor downloads. See vite.config.ts.
#
# This does nothing until Pages is enabled on the repo with Source = GitHub
# Actions. Until then it is inert.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the Pages token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Kept on current majors deliberately: GitHub retires the Node the actions
      # themselves run on, and an action a major behind starts emitting
      # deprecation warnings and is eventually forced onto a runtime it was not
      # built for. The build Node below tracks what the repo is developed on.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The gate, not decoration: this is the project whose whole claim is that
      # the download produces a real font, so a red build must not publish.
      - run: npm run typecheck
      - run: npm run test

      - run: npm run build

      # The first deploy went out missing glyph-data.json and the page died on a
      # 404, because that file is generated and gitignored and `build` did not
      # make it. `build` does now — this is the guard that the next generated
      # thing does not repeat the trick. Everything listed here is fetched at
      # runtime, so a missing one is a broken site, not a degraded one.
      - name: Check the build carries what the page fetches
        run: |
          set -eux
          test -f dist/index.html
          test -f dist/glyph-data.json
          test -f dist/CNAME
          test -f dist/share.png
          test "$(ls dist/fonts/preview/*.woff2 | wc -l)" -eq 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
