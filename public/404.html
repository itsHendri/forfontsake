<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>No page here · For Font's Sake</title>
    <style>
      /* the workbench's own tokens, copied: this page loads nothing else */
      :root {
        --ink: #1d1712;
        --paper: #efe9df;
        --muted: #615548;
        --mark: #b84f1b;
        --mark-fill: #ff7a3d;
        --mark-fill-edge: #b84f1b;
        --on-mark: #17130f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #efe6d8;
          --paper: #17130f;
          --muted: #a39684;
          --mark: #ff7a3d;
          --mark-fill-edge: #ff7a3d;
        }
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 18vh 16px 0;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        background: var(--mark-fill);
        color: var(--on-mark);
        border: 1px solid var(--mark-fill-edge);
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--mark);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No page here</h1>
      <p>This address has nothing on it. Everything at For Font's Sake happens on one page, the workbench.</p>
      <a href="/">Open the workbench</a>
    </main>
  </body>
</html>
